name: Fetch Tenders

on:
  schedule:
    # keep in sync with CRON_TO_KEY in .github/scripts/resolve_sources.py
    - cron: "30 0 * * *"    # CPPP        – 6:00 AM IST
    - cron: "0 1 * * *"     # MP          – 6:30 AM IST
    - cron: "30 1 * * *"    # UP          – 7:00 AM IST
    - cron: "0 2 * * *"     # Rajasthan   – 7:30 AM IST
    - cron: "30 2 * * *"    # TN          – 8:00 AM IST
    - cron: "0 3 * * *"     # Kerala      – 8:30 AM IST
    - cron: "30 3 * * *"    # Maharashtra – 9:00 AM IST
    - cron: "0 4 * * *"     # NTPC        – 9:30 AM IST
    - cron: "30 4 * * *"    # SECI        – 10:00 AM IST
    - cron: "0 5 * * *"     # SJVN        – 10:30 AM IST
    - cron: "30 5 * * *"    # GeM         – 11:00 AM IST
    - cron: "0 6 * * *"     # ETENDERS    – 11:30 AM IST
    - cron: "30 6 * * *"    # WB          – 12:00 PM IST
    - cron: "0 7 * * *"     # Odisha      – 12:30 PM IST
    - cron: "30 7 * * *"    # Punjab      – 1:00 PM IST
    - cron: "0 8 * * *"     # Haryana     – 1:30 PM IST
    - cron: "30 8 * * *"    # HP          – 2:00 PM IST
    - cron: "0 9 * * *"     # UK          – 2:30 PM IST
    - cron: "30 9 * * *"    # JK          – 3:00 PM IST
    - cron: "0 10 * * *"    # Jharkhand   – 3:30 PM IST
    - cron: "30 10 * * *"   # Assam       – 4:00 PM IST
    - cron: "0 11 * * *"    # POWERGRID   – 4:30 PM IST
    - cron: "30 11 * * *"   # NTPCSITE    – 5:00 PM IST
    - cron: "0 12 * * *"    # NGEL        – 5:30 PM IST
    - cron: "30 12 * * *"   # THDC        – 6:00 PM IST
    - cron: "0 13 * * *"    # PFCCL       – 6:30 PM IST
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to run"
        type: choice
        default: all
        options:
          - all
          - CPPP
          - MP
          - GeM
          - UP
          - Rajasthan
          - TN
          - Kerala
          - Maharashtra
          - NTPC
          - SECI
          - SJVN
          - ETENDERS
          - WB
          - Odisha
          - Punjab
          - Haryana
          - HP
          - UK
          - JK
          - Jharkhand
          - Assam
          - POWERGRID
          - NTPCSITE
          - NGEL
          - THDC
          - PFCCL

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve which source key(s) to run
        id: pick
        env:
          INPUT_SOURCE:  ${{ github.event.inputs.source }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python .github/scripts/resolve_sources.py

  scrape:
    needs: resolve
    if: needs.resolve.outputs.sources != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source_key: ${{ fromJson(needs.resolve.outputs.sources) }}
    concurrency:
      group: fetch-${{ matrix.source_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Google Chrome
        run: |
          # apt-key was removed from current Ubuntu runner images; use a keyring file instead
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check sector filter and source config
        run: |
          python tests/test_sector_filter.py
          python tests/test_config_sync.py
          python tests/test_psu_parsers.py

      - name: Write sheets.json from secret
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          python -c "import json, os; json.dump({'SHEET_URL': os.environ['SHEET_URL']}, open('sheets.json', 'w'))"

      - name: Run tender scraper (${{ matrix.source_key }})
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          SOURCE_KEY: ${{ matrix.source_key }}
          DISCOVERY_DATABASE_URL: ${{ secrets.DISCOVERY_DATABASE_URL }}
        run: python main.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-${{ matrix.source_key }}-${{ github.run_id }}
          path: "*.html"
          retention-days: 7
          if-no-files-found: ignore
